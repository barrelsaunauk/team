<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:#fff;color:var(--g);-webkit-font-smoothing:antialiased}
.ph{max-width:760px;margin:0 auto}

.hero{position:relative;min-height:300px;background:#16261C center/cover;color:#fff;display:flex;align-items:flex-end;padding:24px 20px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,38,28,.35),rgba(22,38,28,.92))}

.wrap{padding:24px 18px 50px}
.search{display:flex;gap:8px;align-items:center;border:1px solid var(--hair);border-radius:99px;padding:6px 6px 6px 16px;margin-bottom:22px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chap{position:relative;display:block;border-radius:24px;overflow:hidden;min-height:150px;color:#fff;text-decoration:none;background:#16261C center/cover}
.chap::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,38,28,.2),rgba(22,38,28,.9))}
.chap .in{position:absolute;left:14px;right:14px;bottom:14px}
.chap .n{position:absolute;top:12px;right:14px;font-size:11px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.8)}
.chap b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.chap span{display:block;font-size:11.5px;opacity:.8;margin-top:3px;line-height:1.35}
.chap .ic{font-size:22px;display:block;margin-bottom:4px}
.card{border:1px solid var(--hair);border-radius:24px;padding:18px 18px 8px;margin-bottom:14px}
.card h3{font-size:17px;font-weight:600;line-height:1.25}
.card .sub{font-size:12px;color:var(--soft);margin-top:2px}
.sr{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--hair);font-size:14px;line-height:1.5}
.card h3+.sr,.card .sub+.sr{margin-top:10px}
.sr dt{font-weight:600;font-size:12.5px;color:var(--g2)}
.tb{border:1px solid var(--hair);border-radius:24px;overflow:hidden;margin-bottom:14px}
.tb h3{font-size:17px;font-weight:600;padding:16px 18px 10px}
.tbw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#EEF4EF;text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--g2);padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--hair);vertical-align:top}
td:first-child{font-weight:500}
.note{background:#EEF4EF;border-radius:18px;padding:13px 16px;font-size:13.5px;line-height:1.55;margin-bottom:14px}
.note.warn{background:#FDECEC;color:#7d2427}
.lk{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--hair);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.lk b{display:block;font-size:15px;font-weight:600}.lk span{font-size:12.5px;color:var(--soft)}
.lb{display:flex;gap:6px;flex:none}
.lb a,.lb button{font:600 12.5px Poppins,sans-serif;border-radius:99px;padding:9px 13px;text-decoration:none;border:1px solid var(--hair);background:#fff;color:var(--g);cursor:pointer}
.lb a{background:var(--g);color:#fff;border-color:var(--g)}
.pn{font-size:12px;color:var(--soft);margin:4px 0 18px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.nav a{flex:1;text-decoration:none;border:1px solid var(--hair);border-radius:20px;padding:12px 14px;color:var(--g);font-size:13px}
.nav a b{display:block;font-size:14px;font-weight:600}
.nav a.r{text-align:right}
.hit{border:1px solid var(--hair);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:block;text-decoration:none;color:var(--g)}
.hit b{font-size:14px;font-weight:600}.hit span{display:block;font-size:12px;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--g);color:#fff;border-radius:99px;padding:10px 18px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:520px){.sr{grid-template-columns:1fr;gap:2px}.lk{flex-direction:column;align-items:flex-start}.grid{gap:10px}.chap{min-height:140px}}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr}}

{id:'sales',ic:'🏆',t:'How real buyers said yes',sub:'Real BSUK sales and the lesson from each',img:'globe',body:()=>

 ['Your build timeline','Sent after the deposit. Great for "why windows, not dates?".','https://barrelsaunauk.github.io/internal/deposit_paid_build_timeline.html']
];

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2200)}
function bind(){document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast("Link copied")}catch(e){toast("Couldn't copy, press and hold the link instead")}})}
function contents(){
  document.title="Library | BSUK Sales Hub";
  app.innerHTML=`<div class="hero" style="background-image:url('${PHOTOS.roof}')"><div class="top"><a href="sales_hub.html" onclick="if(window.opener){window.close();}">← Sales Hub</a></div><div><div class="k">The library</div><h1>Everything you <span class="b">need</span></h1><p>Pick a chapter. Each one opens on its own page, so it's never one long scroll.</p></div></div>
  <div class="wrap"><form class="search" id="sf"><span>🔎</span><input id="q" type="search" placeholder="seating, porch price, deposit" autocomplete="off"></form><div id="hits"></div>
  <div class="k" style="margin-bottom:12px">Contents</div>
  <div class="grid">${CH.map((c,i)=>`<a class="chap" href="?ch=${c.id}" target="_blank" rel="noopener" style="background-image:url('${PHOTOS[c.img]}')"><span class="n">${String(i+1).padStart(2,"0")}</span><div class="in"><span class="ic">${c.ic}</span><b>${c.t}</b><span>${c.sub}</span></div></a>`).join("")}</div></div>`;
  const q=document.getElementById("q");q.oninput=()=>search(q.value);document.getElementById("sf").onsubmit=e=>{e.preventDefault();search(q.value)};
  const pre=new URLSearchParams(location.search).get("q");if(pre){q.value=pre;search(pre)}
}
function search(v){
  const w=v.toLowerCase().split(/\s+/).filter(x=>x.length>2),box=document.getElementById("hits");
  if(!w.length){box.innerHTML="";return}
  const hits=[];CH.forEach(c=>{const tmp=document.createElement("div");tmp.innerHTML=c.body();tmp.querySelectorAll(".card,.tb,.note,.lk").forEach(el=>{const t=el.textContent.toLowerCase();const n=w.filter(x=>t.includes(x)).length;if(n)hits.push({c,n,title:(el.querySelector("h3,b")||el).textContent.slice(0,80)})})});
  hits.sort((a,b)=>b.n-a.n);
  box.innerHTML=hits.length?`<div class="k" style="margin-bottom:8px">Found</div>`+hits.slice(0,8).map(h=>`<a class="hit" href="?ch=${h.c.id}" target="_blank" rel="noopener"><b>${esc(h.title)}</b><span>${h.c.ic} ${h.c.t}</span></a>`).join("")+'<div style="height:18px"></div>':'<p class="pn">Nothing for that yet. Try one word, like "porch" or "deposit".</p>';
}
function chapter(id){
  const i=CH.findIndex(c=>c.id===id);if(i<0)return contents();const c=CH[i],p=CH[i-1],n=CH[i+1];
  document.title=c.t+" | BSUK Library";
  app.innerHTML=`<div class="hero" style="background-image:url('${PHOTOS[c.img]}')"><div class="top"><a href="library.html">← Contents</a></div><div><div class="k">Chapter ${i+1}</div><h1>${c.ic} ${c.t}</h1><p>${c.sub}</p></div></div>
  <div class="wrap"><p class="pn">${PRICE_NOTE}</p>${c.body()}
  <div class="nav">${p?`<a href="?ch=${p.id}">← Previous<b>${p.t}</b></a>`:"<span></span>"}${n?`<a class="r" href="?ch=${n.id}">Next →<b>${n.t}</b></a>`:"<span></span>"}</div></div>`;
  bind();scrollTo(0,0);
}
const ch=new URLSearchParams(location.search).get("ch");ch?chapter(ch):contents();
</script></body></html>
