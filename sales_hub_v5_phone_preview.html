<body><div><div class="phone"><iframe title="Sales Hub on a phone" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en-GB&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;meta name=&quot;robots&quot; content=&quot;noindex&quot;&gt;
&lt;title&gt;Sales Hub | Barrel Sauna UK&lt;/title&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;family=Caveat:wght@600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
:root{
  --ground:#16261C; --deep:#1F3D28; --forest:#2B5336; --mid:#417C51; --sage:#50795F; --pale:#8fae86;
  --honey:#C08B41; --honeyL:#D6A868; --tint:#dbe7dd; --tint2:#eef4ef; --line:#e3ebe4; --wa:#31D24F;
  --shadow:0 1px 2px rgba(22,38,28,.06),0 8px 24px rgba(22,38,28,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Poppins,Arial,sans-serif;font-weight:400;color:var(--ground);background:#fff;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4,b,strong{font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--honey)}
.hidden{display:none!important}
.muted{color:var(--sage)}
.small-text{font-size:13px}

/* top bar */
.bar{background:var(--ground);color:#fff;position:sticky;top:0;z-index:30}
.bar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-weight:700;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--honeyL)}
.nav{display:flex;gap:4px;margin-left:24px}
.nav a{color:#cfe0d2;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;color:#cfe0d2}
.who button{color:#cfe0d2;font-size:13px;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:999px}
.demo-pill{background:rgba(214,168,104,.16);color:var(--honeyL);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.brand,.who button{white-space:nowrap}
@media(max-width:760px){.nav{display:none}.who .name{display:none}}
@media(max-width:480px){.demo-pill,#libTop{display:none}.bar .wrap{gap:10px}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--ground);padding:24px}
.login-card{background:#fff;border-radius:22px;padding:40px 34px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login-card h1{font-size:28px;line-height:1.15;margin:10px 0 8px}
.login-card h1 span{color:var(--honey)}
.login-card p{color:var(--sage);font-size:14px;margin-bottom:22px}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;outline:none;transition:border .15s}
.field:focus{border-color:var(--mid)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;transition:transform .1s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--deep);color:#fff}
.btn-primary:hover{background:var(--forest)}
.btn-ghost{background:var(--tint2);color:var(--deep)}
.btn-ghost:hover{background:var(--tint)}
.btn-line{border:1.5px solid var(--line);color:var(--deep);background:#fff}
.btn-line:hover{border-color:var(--pale)}
.btn-block{width:100%}
.login-msg{margin-top:14px;font-size:14px;color:var(--deep);background:var(--tint2);border-radius:12px;padding:12px 14px}
.login-alt{margin-top:18px;text-align:center;font-size:13px}
.login-alt button{color:var(--mid);text-decoration:underline;text-underline-offset:3px}

/* sections */
section.band{padding:40px 0}
section.band.dark{background:var(--ground);color:#fff}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(24px,3vw,32px);line-height:1.15;margin-top:6px}
.sec-head h2 span{color:var(--honey)}
.dark .sec-head h2 span{color:var(--honeyL)}

/* configurator placeholder */
.config{border:1.5px dashed var(--pale);border-radius:22px;background:var(--tint2);padding:36px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.config h2{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:8px 0 10px}
.config h2 span{color:var(--honey)}
.config p{color:var(--sage);max-width:460px}
.config-stage{aspect-ratio:16/10;border-radius:16px;background:#fff;display:grid;place-items:center;position:relative;box-shadow:var(--shadow)}
.config-stage svg{width:62%;opacity:.9}
.dot{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--honey);border:3px solid #fff;box-shadow:0 0 0 0 rgba(192,139,65,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,139,65,.6)}70%{box-shadow:0 0 0 12px rgba(192,139,65,0)}100%{box-shadow:0 0 0 0 rgba(192,139,65,0)}}
.soon{display:inline-block;margin-top:14px;font-size:12px;font-weight:700;color:var(--deep);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px}
@media(max-width:820px){.config{grid-template-columns:1fr;padding:24px}}

/* dashboard */
.greet{font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin-top:6px}
.greet span{color:var(--honey)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0 18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:30px;font-weight:700;line-height:1.1;color:var(--deep)}
.stat .n small{font-size:14px;color:var(--sage);font-weight:400}
.stat .l{font-size:13px;color:var(--sage);margin-top:4px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.card h3{font-size:18px;line-height:1.25;margin:6px 0 12px}
.stack{display:grid;gap:18px;align-content:start}

/* coaching */
.coach{background:var(--deep);color:#fff;border:none}
.coach .kicker{color:var(--honeyL)}
.coach h3{font-size:22px}
.coach .from{font-size:13px;color:var(--pale);margin-bottom:16px}
.coach-block{background:rgba(255,255,255,.06);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.coach-block .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--pale);margin-bottom:4px}
.coach-block.try{background:#fff;color:var(--ground)}
.coach-block.try .lab{color:var(--sage)}
.coach-block.try p{font-weight:600}
.score{display:inline-flex;align-items:baseline;gap:4px;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:999px;font-size:13px;color:#fff;float:right}
.score b{font-size:18px}
.replies{display:grid;gap:8px;margin-top:14px}
.reply{text-align:left;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);color:#fff;font-size:14px;transition:background .15s}
.reply:hover{background:rgba(255,255,255,.08)}
.reply.sel{background:#fff;color:var(--deep);border-color:#fff;font-weight:600}
.link-btn{color:var(--pale);font-size:13px;text-decoration:underline;text-underline-offset:3px;margin-top:12px}
.bars{display:grid;gap:7px;margin-top:12px}
.barrow{display:grid;grid-template-columns:120px 1fr 22px;align-items:center;gap:10px;font-size:12.5px}
.track{height:7px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.fill{height:100%;border-radius:9px;background:var(--pale)}
.fill.low{background:var(--honeyL)}
.flags{font-size:13px;color:#f3dcc0;margin-top:10px;white-space:pre-line}

/* lists */
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--tint2)}
.item .tick{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--pale);margin-top:2px;background:#fff}
.item .t{font-size:14px;font-weight:600;line-height:1.35}
.item .d{font-size:12.5px;color:var(--sage)}
.empty{font-size:14px;color:var(--sage);padding:6px 2px}
.focus-stage{font-size:26px;font-weight:700;color:var(--deep);line-height:1.15}
.focus-stage span{color:var(--honey)}
.qa{border-left:3px solid var(--honey);padding:4px 0 4px 12px;margin-bottom:10px}
.qa .q{font-size:13px;color:var(--sage)}
.qa .a{font-size:14px;font-weight:600}

/* next customer */
.cust{background:#fff;color:var(--ground);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.cust-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cust-name{font-size:clamp(26px,3.4vw,36px);font-weight:700;line-height:1.1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--tint2);color:var(--deep)}
.chip.warm{background:#f7ecdc;color:#7a5320}
.pager{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sage)}
.pager{color:var(--pale)}
.pager button{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;font-size:17px}
.pager button:hover{background:rgba(255,255,255,.1)}
.cust-body{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-top:22px}
@media(max-width:820px){.cust-body{grid-template-columns:1fr}}
.told{font-size:16px;line-height:1.6}
.facts{display:grid;gap:10px}
.fact{background:var(--tint2);border-radius:14px;padding:12px 14px}
.fact .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--sage)}
.fact .v{font-size:15px;font-weight:600;margin-top:2px}
.notes{margin-top:16px;display:grid;gap:6px}
.notes div{font-size:13.5px;color:var(--sage);padding-left:12px;border-left:2px solid var(--tint)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}
.btn-call{background:var(--deep);color:#fff;padding:14px 26px;font-size:15px}
.btn-call:hover{background:var(--forest)}
.btn-help{margin-left:auto;background:var(--tint2);color:var(--deep)}
@media(max-width:600px){.btn-help{margin-left:0}.actions .btn{flex:1 1 45%}}

/* help panel */
.scrim{position:fixed;inset:0;background:rgba(22,38,28,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:#fff;z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.panel.on{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.18)}
@media(max-width:700px){.panel{top:auto;bottom:0;height:86vh;width:100%;border-radius:22px 22px 0 0;transform:translateY(100%)}}
.panel-head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.panel-head .row{display:flex;justify-content:space-between;align-items:center}
.panel-head h3{font-size:19px;margin-top:4px}
.x{width:36px;height:36px;border-radius:50%;background:var(--tint2);display:grid;place-items:center;font-size:18px;color:var(--deep)}
.search{position:relative;margin-top:14px}
.search input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;font-size:14.5px;outline:none}
.search input:focus{border-color:var(--mid)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--sage)}
.panel-body{flex:1;overflow:auto;padding:16px 20px 24px}
.ctx{font-size:12.5px;color:var(--sage);margin-bottom:12px}
.lcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.lcard .g{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--honey)}
.lcard h4{font-size:15px;margin:3px 0 6px}
.lcard .say{font-size:14px;line-height:1.55;margin-bottom:6px}
.lcard .say::before{content:&quot;Say: &quot;;font-weight:700;color:var(--sage)}
.lcard .fact-line{font-size:13.5px;color:var(--ground);margin-bottom:4px}
.lcard .tipline{font-size:12.5px;color:var(--sage);margin-top:6px}
.copy{margin-top:8px;font-size:12px;font-weight:700;color:var(--deep);background:var(--tint2);padding:6px 12px;border-radius:999px}
.panel-foot{padding:14px 20px;border-top:1px solid var(--line)}
.lib-groups{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lib-groups button{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--tint2);color:var(--deep)}
.lib-groups button.on{background:var(--deep);color:#fff}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(22,38,28,.45)}
.modal-card{background:#fff;border-radius:20px;padding:24px;width:min(460px,100%)}
.modal-card h3{font-size:19px;margin:4px 0 14px}
.modal-card textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14.5px;outline:none;resize:vertical}
.modal-card label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ground);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:60;opacity:0;transition:all .25s;max-width:min(520px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{padding:28px 0 40px;font-size:12.5px;color:var(--sage);text-align:center}

/* ================= v3: white base, sticky notes, handwriting ================= */
:root{--char:#2B2B2B;--red:#D64545;--ok:#2FA84F;--y:#FFF1A6;--pink:#FFD9E2;--blue:#D6E9FF;--mint:#D8F3E2;--hand:&quot;Caveat&quot;,cursive}
body{color:var(--char);background:#fff}
.kicker{color:var(--deep)}
.bar{background:var(--char)}
.brand span{color:#9fd3ad}
.demo-pill{background:var(--y);color:var(--char)}
section.band.dark{background:#fff;color:var(--char)}
.sec-head h2 span,.config h2 span,.dark .sec-head h2 span,.login-card h1 span{color:var(--deep);background:linear-gradient(transparent 62%,var(--mint) 62%);padding:0 2px}
.login{background:#f6f7f5}
.login-card{box-shadow:0 20px 60px rgba(0,0,0,.12);border:1px solid #eee}
.config{background:#fff;border-color:#cfd6d0}
.config-stage{background:#fafbfa}
.dot{background:var(--red)}
.greet span{font-family:var(--hand);font-weight:700;font-size:1.35em;color:var(--deep)}
.stat{border-color:#ececec}
.stat .n{color:var(--char)}
.stat.alert .n{color:var(--red)}
.hand{font-family:var(--hand);font-weight:700;color:var(--deep);font-size:22px;line-height:1.1;display:inline-flex;align-items:center;gap:6px}
.hand.red{color:var(--red)}
.hand svg{flex:none}

/* sticky notes */
.sticky{position:relative;border:none;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.10);padding:26px 22px 22px}
.sticky::before{content:&quot;📌&quot;;position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(8deg);font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.sticky.y{background:var(--y);transform:rotate(-.8deg)}
.sticky.pink{background:var(--pink);transform:rotate(.9deg)}
.sticky.blue{background:var(--blue);transform:rotate(-.6deg)}
.sticky.mint{background:var(--mint);transform:rotate(.6deg)}
.sticky .kicker{color:var(--char);opacity:.75}
.sticky h3{color:var(--char)}

/* coach on yellow */
.coach{background:var(--y);color:var(--char)}
.coach .kicker{color:var(--char)}
.coach .from{color:#6b6440}
.coach-block{background:rgba(255,255,255,.55)}
.coach-block .lab{color:#6b6440}
.coach-block.try{background:#fff;border:2px dashed var(--deep)}
.coach-block.try .lab{color:var(--deep)}
.score{background:#fff;color:var(--char)}
.reply{border:1.5px solid rgba(0,0,0,.15);color:var(--char);background:rgba(255,255,255,.4)}
.reply:hover{background:#fff}
.reply.sel{background:var(--deep);color:#fff;border-color:var(--deep)}
.link-btn{color:var(--deep);font-weight:600}
.track{background:rgba(0,0,0,.08)}
.fill{background:var(--ok)}
.fill.low{background:var(--red)}
.flags{color:var(--red);font-weight:600}

/* checklists */
.item{background:rgba(255,255,255,.65)}
.item .tick{border:2px solid var(--ok);border-radius:6px;cursor:pointer;display:grid;place-items:center;font-size:13px;color:#fff}
.item .tick.done{background:var(--ok)}
.item.overdue .d{color:var(--red);font-weight:600}
.focus-stage{color:var(--char)}
.focus-stage span{color:var(--red);font-family:var(--hand);font-size:1.3em}
.qa{border-left-color:var(--deep)}
.qa .q{color:#4d5a52}

/* customer card on white */
.cust{border:1px solid #e8e8e8;box-shadow:0 18px 50px rgba(0,0,0,.08)}
.pager{color:#777}
.pager button{border:1.5px solid #ddd;color:var(--char)}
.pager button:hover{background:#f4f4f4}
.chip{background:#f2f4f2;color:var(--char)}
.chip.warm{background:var(--y);color:var(--char)}
.chip.hot{background:var(--mint);color:#1d5c32}
.fact{background:#f7f8f7}
.fact.red .v{color:var(--red)}
.actions{position:relative;align-items:center}
.btn-call{font-size:15.5px;box-shadow:0 6px 16px rgba(31,61,40,.25)}
.btn-help{background:var(--pink);color:var(--char)}
.btn-ghost{background:#f2f4f2;color:var(--char)}
.actions{padding-top:44px}
.call-hint{position:absolute;left:6px;top:10px;transform:rotate(-3deg)}
.help-hint{position:absolute;right:8px;top:10px;transform:rotate(3deg)}
@media(max-width:600px){.help-hint{display:none}}

/* panel */
.lcard .g{color:var(--deep)}
.lcard.rule{border-color:#f1c7c7;background:#fff7f7}
.lcard.rule .g{color:var(--red)}
.lcard .say{background:var(--y);padding:8px 10px;border-radius:6px}
.lcard .say::before{content:&quot;🗣️ &quot;;}
.search-hint{display:block;margin:10px 0 0 4px;transform:rotate(-2deg)}
.lib-groups button.on{background:var(--char)}
.copy{background:var(--mint);color:#1d5c32}
footer{color:#888}

/* ===== Option B: calmer ===== */
.sticky{transform:none!important;border-radius:16px;background:#fff!important;border:1px solid #ececec;border-left:6px solid var(--stripe,#ddd);box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px rgba(0,0,0,.05);padding:22px}
.sticky::before{display:none}
.sticky.y{--stripe:#F2D64B}.sticky.pink{--stripe:#F29BB0}.sticky.blue{--stripe:#7FB2EA}.sticky.mint{--stripe:var(--ok)}
.coach{color:var(--char)}
.coach-block{background:#fafafa}
.coach-block.try{border:1.5px solid var(--deep)}
.reply{background:#fff}
.item{background:#f7f8f7}

/* ===== Serious v2: depth ===== */
body{background:#EEF1EC;background-image:radial-gradient(1200px 600px at 10% -10%,#f8faf6 0%,rgba(248,250,246,0) 60%),radial-gradient(900px 500px at 110% 30%,#e6ece4 0%,rgba(230,236,228,0) 60%)}

section.band{padding:44px 0}
#next{background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(31,61,40,.05) 100%)}
.card,.stat,.side,.cust,.sticky{background:#fff;border:1px solid rgba(255,255,255,.9);
  box-shadow:0 1px 1px rgba(22,38,28,.04),0 6px 14px -4px rgba(22,38,28,.10),0 24px 48px -16px rgba(22,38,28,.20);
  transition:transform .2s ease,box-shadow .2s ease}
.card:hover,.stat:hover,.side:hover,.sticky:hover{transform:translateY(-3px);box-shadow:0 2px 2px rgba(22,38,28,.04),0 12px 24px -6px rgba(22,38,28,.14),0 36px 64px -18px rgba(22,38,28,.26)}
.sticky{border-left:6px solid var(--stripe,#ddd)}
/* inset blocks */
.coach-block,.fact,.item{background:#F4F6F3;box-shadow:inset 0 1px 3px rgba(22,38,28,.08);border:none}
.coach-block.try{background:#fff;box-shadow:inset 0 0 0 1.5px var(--deep),0 6px 16px -8px rgba(31,61,40,.35)}
.reply{background:#fff;box-shadow:0 2px 6px -2px rgba(22,38,28,.12)}
/* stat icons */
.stat{position:relative;padding-top:22px}
.stat .ic{position:absolute;top:-14px;right:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#fff;box-shadow:0 6px 14px -4px rgba(22,38,28,.25)}
/* customer card: most lifted, green header strip */
.cust{padding:0;overflow:hidden;box-shadow:0 2px 2px rgba(22,38,28,.05),0 18px 36px -10px rgba(22,38,28,.22),0 50px 90px -30px rgba(22,38,28,.35)}
.cust-head{background:var(--deep);color:#fff;padding:22px 28px}

.cust-inner{padding:6px 28px 26px}
/* jump to configurator */
.jump{display:inline-flex;align-items:center;gap:12px;margin-top:18px;background:var(--deep);color:#fff;border-radius:999px;padding:14px 22px 14px 16px;font-weight:700;font-size:15px;text-decoration:none;box-shadow:0 10px 24px -8px rgba(31,61,40,.55);transition:transform .2s,box-shadow .2s}
.jump:hover{transform:translateY(-2px);box-shadow:0 16px 32px -10px rgba(31,61,40,.6)}
.jump .ji{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:17px}
.jump .arr{font-size:18px;opacity:.85}
.today-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
/* configurator band */
.cfg-band{padding-bottom:60px}
.cfg-shell{background:#fff;border-radius:28px;box-shadow:0 2px 2px rgba(22,38,28,.05),0 18px 36px -10px rgba(22,38,28,.18),0 50px 90px -30px rgba(22,38,28,.30)}
#cfg .cfg-wrap{padding:44px 36px 48px}
@media(max-width:700px){#cfg .cfg-wrap{padding:28px 18px 32px}.cust-head,.cust-inner{padding-left:18px;padding-right:18px}}

/* ===== v3: photo-led floating cards ===== */

.photo-strip{margin:0 0 16px;border-radius:20px;height:120px;background-size:cover;background-position:center;position:relative;overflow:hidden;background-color:#cfd5cf}

async function api(path, opts={}){
  const r = await fetch(API+path,{...opts,headers:{&quot;content-type&quot;:&quot;application/json&quot;,authorization:&quot;Bearer &quot;+token,...(opts.headers||{})}});
  const j = await r.json().catch(()=&gt;({ok:false,error:&quot;No answer from the hub&quot;}));
  if(r.status===401){signOut();throw new Error(j.error||&quot;Please sign in again&quot;)}
  if(!j.ok)throw new Error(j.error||&quot;Something went wrong&quot;);
  return j;
}

    if(Math.abs(dx)&gt;60&amp;&amp;Math.abs(dx)&gt;Math.abs(dy)*1.5&amp;&amp;n&gt;1){qi=dx&lt;0?(qi+1)%n:(qi-1+n)%n;showCustomer()}},{passive:true});
  box.querySelectorAll(&quot;.side-card&quot;).forEach(b=&gt;b.onclick=()=&gt;{qi=+b.dataset.i;showCustomer()});
  $(&quot;aCall&quot;).addEventListener(&quot;click&quot;,()=&gt;act(&quot;/call&quot;,{contactId:c.id},&quot;Sample data: your phone would ring, then you&#x27;d be put through to &quot;+c.name.split(&quot; &quot;)[0]+&quot;.&quot;));
  $(&quot;aNote&quot;).addEventListener(&quot;click&quot;,noteModal);
  $(&quot;aFollow&quot;).addEventListener(&quot;click&quot;,followModal);
  $(&quot;aHelp&quot;).addEventListener(&quot;click&quot;,()=&gt;openPanel({customer:c}));
}
$(&quot;nextCust&quot;).addEventListener(&quot;click&quot;,()=&gt;{if(!QUEUE.length)return;qi=(qi+1)%QUEUE.length;showCustomer()});
$(&quot;prevCust&quot;).addEventListener(&quot;click&quot;,()=&gt;{if(!QUEUE.length)return;qi=(qi-1+QUEUE.length)%QUEUE.length;showCustomer()});

async function act(path,body,previewMsg){
  if(preview){toast(previewMsg);return true}
  try{const j=await api(path,{method:&quot;POST&quot;,body:JSON.stringify(body)});toast(j.message);return true}catch(e){toast(e.message);return false}
}

function modal(html,onSave){
  const m=document.createElement(&quot;div&quot;);m.className=&quot;modal&quot;;m.innerHTML=`&lt;div class=&quot;modal-card&quot;&gt;${html}&lt;div class=&quot;modal-actions&quot;&gt;&lt;button class=&quot;btn btn-line&quot; type=&quot;button&quot; data-x&gt;Cancel&lt;/button&gt;&lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; data-s&gt;Save&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  document.body.appendChild(m);
  const close=()=&gt;m.remove();
  m.querySelector(&quot;[data-x]&quot;).onclick=close;m.addEventListener(&quot;click&quot;,e=&gt;{if(e.target===m)close()});
  m.querySelector(&quot;[data-s]&quot;).onclick=async()=&gt;{if(await onSave(m))close()};
  const f=m.querySelector(&quot;textarea,input&quot;);if(f)f.focus();
}
function noteModal(){
  modal(`&lt;div class=&quot;kicker&quot;&gt;${esc(CUR.name)}&lt;/div&gt;&lt;h3&gt;Add a note&lt;/h3&gt;&lt;textarea placeholder=&quot;What should the team know? e.g. Partner is the one who decides, call after 6pm.&quot;&gt;&lt;/textarea&gt;`,
    async(m)=&gt;{const t=m.querySelector(&quot;textarea&quot;).value.trim();if(!t){toast(&quot;Write something first&quot;);return false}return act(&quot;/note&quot;,{contactId:CUR.id,text:t},&quot;Sample data: the note would be saved on &quot;+CUR.name+&quot;.&quot;)});
}
function followModal(){
  const d=new Date(Date.now()+864e5);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
  modal(`&lt;div class=&quot;kicker&quot;&gt;${esc(CUR.name)}&lt;/div&gt;&lt;h3&gt;Book a follow-up&lt;/h3&gt;
    &lt;label for=&quot;fuT&quot;&gt;What for&lt;/label&gt;&lt;input class=&quot;field&quot; id=&quot;fuT&quot; value=&quot;Follow up: ${esc(CUR.name.split(&quot; &quot;)[0])}&quot;&gt;
    &lt;label for=&quot;fuD&quot;&gt;When&lt;/label&gt;&lt;input class=&quot;field&quot; id=&quot;fuD&quot; type=&quot;date&quot; value=&quot;${d.toISOString().slice(0,10)}&quot;&gt;
    &lt;p class=&quot;muted small-text&quot; style=&quot;margin-top:8px&quot;&gt;Weekends move to Monday.&lt;/p&gt;`,
    async(m)=&gt;act(&quot;/followup&quot;,{contactId:CUR.id,title:m.querySelector(&quot;#fuT&quot;).value,date:m.querySelector(&quot;#fuD&quot;).value},&quot;Sample data: follow-up would be booked on &quot;+m.querySelector(&quot;#fuD&quot;).value+&quot;.&quot;));
}

/* =========================================================================
   HELP PANEL AND LIBRARY
   ========================================================================= */
let libGroup=&quot;All&quot;;
function cardHTML(c){
  const ico={&quot;On the call&quot;:&quot;📞&quot;,&quot;The sauna&quot;:&quot;🧖&quot;,&quot;Other products&quot;:&quot;🛁&quot;,&quot;Delivery and site&quot;:&quot;🚚&quot;,&quot;Objections&quot;:&quot;🤔&quot;,&quot;Deposit&quot;:&quot;💷&quot;,&quot;Rules&quot;:&quot;🚩&quot;}[c.g]||&quot;📌&quot;;
  return `&lt;div class=&quot;lcard${c.g===&quot;Rules&quot;?&quot; rule&quot;:&quot;&quot;}&quot;&gt;&lt;div class=&quot;g&quot;&gt;${esc(c.g)}&lt;/div&gt;&lt;h4&gt;${esc(c.t)}&lt;/h4&gt;
    ${(c.say||[]).map(x=&gt;`&lt;p class=&quot;say&quot;&gt;${esc(x)}&lt;/p&gt;`).join(&quot;&quot;)}
    ${(c.f||[]).map(x=&gt;`&lt;p class=&quot;fact-line&quot;&gt;&amp;#8226; ${esc(x)}&lt;/p&gt;`).join(&quot;&quot;)}
    ${c.tip?`&lt;p class=&quot;tipline&quot;&gt;${esc(c.tip)}&lt;/p&gt;`:&quot;&quot;}
    ${c.copy?`&lt;button class=&quot;copy&quot; type=&quot;button&quot; data-copy=&quot;${esc(c.copy)}&quot;&gt;Copy&lt;/button&gt;`:&quot;&quot;}&lt;/div&gt;`;
}
function score(c,words){const hay=(c.t+&quot; &quot;+c.k+&quot; &quot;+(c.say||[]).join(&quot; &quot;)+&quot; &quot;+(c.f||[]).join(&quot; &quot;)).toLowerCase();let n=0;for(const w of words){if(w.length&lt;3)continue;if((c.t+&quot; &quot;+c.k).toLowerCase().includes(w))n+=3;else if(hay.includes(w))n+=1}return n}
function find(text,limit=8){
  const words=text.toLowerCase().replace(/[^a-z0-9.\s-]/g,&quot; &quot;).split(/\s+/).filter(Boolean);
  return LIB.map(c=&gt;({c,n:score(c,words)})).filter(x=&gt;x.n&gt;0).sort((a,b)=&gt;b.n-a.n).slice(0,limit).map(x=&gt;x.c);
}
function bindCopy(){$(&quot;panelBody&quot;).querySelectorAll(&quot;[data-copy]&quot;).forEach(b=&gt;b.onclick=async()=&gt;{try{await navigator.clipboard.writeText(b.dataset.copy);toast(&quot;Copied&quot;)}catch(e){toast(&quot;Couldn&#x27;t copy, select it instead&quot;)}})}

function openPanel(o={}){
  $(&quot;panel&quot;).classList.add(&quot;on&quot;);$(&quot;scrim&quot;).classList.add(&quot;on&quot;);
  $(&quot;search&quot;).value=o.query||&quot;&quot;;
  if(o.customer){
    const c=o.customer;
    $(&quot;panelKicker&quot;).textContent=&quot;Help for &quot;+c.name.split(&quot; &quot;)[0];$(&quot;panelTitle&quot;).textContent=&quot;What to say&quot;;
    const ctx=(c.product||&quot;&quot;)+&quot; &quot;+(c.objection&amp;&amp;c.objection!==&quot;None&quot;?c.objection:&quot;&quot;);
    const hits=find(ctx,6);
    const always=LIB.filter(x=&gt;x.t===&quot;The deposit, in one line&quot;);
    const list=[...hits,...always.filter(a=&gt;!hits.includes(a))];
    $(&quot;panelBody&quot;).innerHTML=`&lt;p class=&quot;ctx&quot;&gt;Picked for ${esc(c.product||&quot;this customer&quot;)}${c.objection&amp;&amp;c.objection!==&quot;None&quot;?&quot; and &quot;+esc(c.objection.toLowerCase()):&quot;&quot;}.&lt;/p&gt;`+list.map(cardHTML).join(&quot;&quot;);
  }else if(o.query){runSearch()}
  else showLibrary();
  bindCopy();
}
function closePanel(){$(&quot;panel&quot;).classList.remove(&quot;on&quot;);$(&quot;scrim&quot;).classList.remove(&quot;on&quot;)}
$(&quot;panelClose&quot;).addEventListener(&quot;click&quot;,closePanel);$(&quot;scrim&quot;).addEventListener(&quot;click&quot;,closePanel);
document.addEventListener(&quot;keydown&quot;,e=&gt;{if(e.key===&quot;Escape&quot;)closePanel()});

function runSearch(){
  const q=$(&quot;search&quot;).value.trim();
  if(!q){if(CUR)openPanel({customer:CUR});else showLibrary();return}
  const hits=find(q,10);
  $(&quot;panelKicker&quot;).textContent=&quot;Search&quot;;$(&quot;panelTitle&quot;).textContent=`&quot;${q}&quot;`;
  $(&quot;panelBody&quot;).innerHTML=hits.length?hits.map(cardHTML).join(&quot;&quot;):&#x27;&lt;p class=&quot;empty&quot;&gt;Nothing for that yet. Try fewer words, like &quot;porch&quot; or &quot;deposit&quot;.&lt;/p&gt;&#x27;;
  bindCopy();
}
$(&quot;search&quot;).addEventListener(&quot;input&quot;,()=&gt;{clearTimeout(window._s);window._s=setTimeout(runSearch,150)});

function showLibrary(){
  $(&quot;panelKicker&quot;).textContent=&quot;Everything&quot;;$(&quot;panelTitle&quot;).textContent=&quot;📚 Library&quot;;
  const groups=[&quot;All&quot;,...new Set(LIB.map(c=&gt;c.g))];
  const list=libGroup===&quot;All&quot;?LIB:LIB.filter(c=&gt;c.g===libGroup);
  $(&quot;panelBody&quot;).innerHTML=`&lt;div class=&quot;lib-groups&quot;&gt;${groups.map(g=&gt;`&lt;button type=&quot;button&quot; class=&quot;${g===libGroup?&quot;on&quot;:&quot;&quot;}&quot;&gt;${esc(g)}&lt;/button&gt;`).join(&quot;&quot;)}&lt;/div&gt;`+list.map(cardHTML).join(&quot;&quot;);
  $(&quot;panelBody&quot;).querySelectorAll(&quot;.lib-groups button&quot;).forEach(b=&gt;b.onclick=()=&gt;{libGroup=b.textContent;showLibrary()});
  bindCopy();
}
$(&quot;openLibrary&quot;).addEventListener(&quot;click&quot;,()=&gt;{$(&quot;search&quot;).value=&quot;&quot;;showLibrary()});
$(&quot;tabLib&quot;).addEventListener(&quot;click&quot;,()=&gt;{openPanel();$(&quot;search&quot;).value=&quot;&quot;;showLibrary()});
// highlight the tab for the section on screen
if(&quot;IntersectionObserver&quot; in window){const io=new IntersectionObserver(es=&gt;es.forEach(e=&gt;{if(e.isIntersecting)document.querySelectorAll(&quot;.tabbar a&quot;).forEach(a=&gt;a.classList.toggle(&quot;on&quot;,a.dataset.s===e.target.id))}),{rootMargin:&quot;-45% 0px -50% 0px&quot;});[&quot;today&quot;,&quot;next&quot;,&quot;build&quot;].forEach(id=&gt;{const el=document.getElementById(id);if(el)io.observe(el)})}
$(&quot;libTop&quot;).addEventListener(&quot;click&quot;,()=&gt;{openPanel();$(&quot;search&quot;).value=&quot;&quot;;showLibrary()});

/* =========================================================================
   BOOT: token from the magic link (#t=...), or a saved one
   ========================================================================= */
(function boot(){
  const m=location.hash.match(/t=([^&amp;]+)/);
  if(m){store.set(&quot;bsuk_hub_token&quot;,m[1]);history.replaceState(null,&quot;&quot;,location.pathname)}
  token=store.get(&quot;bsuk_hub_token&quot;)||&quot;&quot;;
  preview=true;
  if(token||preview)start();
})();
